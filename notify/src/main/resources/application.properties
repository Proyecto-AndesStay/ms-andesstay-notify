server.port=8082
spring.application.name=ms-andesstay-notify

# Conexión RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# MODO ACK MANUAL (Requisito fundamental de la rúbrica)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Nombres de Colas Centralizadas (Topología AndesStay)
andesstay.rabbitmq.queues.email=q.cmd.email
andesstay.rabbitmq.queues.email-dlq=q.cmd.email.dlq
andesstay.rabbitmq.queues.housekeeping=q.cmd.housekeeping
andesstay.rabbitmq.queues.housekeeping-dlq=q.cmd.housekeeping.dlq
andesstay.rabbitmq.queues.voucher=q.cmd.voucher
andesstay.rabbitmq.queues.voucher-dlq=q.cmd.voucher.dlq